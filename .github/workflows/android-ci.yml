name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Show build toolchain
        run: ./gradlew --version

      - name: Run Android host tests
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload host-test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-test-reports-${{ github.sha }}
          path: |
            shared/build/reports/tests/testAndroidHostTest/
            shared/build/test-results/testAndroidHostTest/TEST-*.xml
          retention-days: 7
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug-${{ github.sha }}
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

  ui-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator UI tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :androidApp:connectedDebugAndroidTest --stacktrace

      - name: Verify UI tests executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report_dir = Path("androidApp/build/outputs/androidTest-results/connected/debug")
          reports = list(report_dir.glob("TEST-*.xml"))
          if not reports:
            raise SystemExit("No UI-test XML reports found")
          cases = []
          for report in reports:
            cases.extend(ET.parse(report).getroot().iter("testcase"))
          total = len(cases)
          skipped = sum(case.find("skipped") is not None for case in cases)
          failures = sum(case.find("failure") is not None for case in cases)
          errors = sum(case.find("error") is not None for case in cases)
          executed = total - skipped
          print(
              f"UI tests: total={total}, executed={executed}, "
              f"skipped={skipped}, failures={failures}, errors={errors}"
          )

          if failures or errors:
            raise SystemExit("UI-test reports contain failures or errors.")

          if executed == 0:
            raise SystemExit("No UI tests executed.")

          print("Verified: UI tests executed successfully.")
          PY

      - name: Upload UI-test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-test-reports-${{ github.sha }}
          path: |
            androidApp/build/reports/androidTests/connected/debug/
            androidApp/build/outputs/androidTest-results/connected/debug/
          retention-days: 7
          if-no-files-found: error
