name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Show build toolchain
        run: ./gradlew --version

      - name: Run Android host tests
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload host-test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-test-reports-${{ github.sha }}
          path: |
            shared/build/reports/tests/testAndroidHostTest/
            shared/build/test-results/testAndroidHostTest/TEST-*.xml
          retention-days: 7
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug-${{ github.sha }}
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error